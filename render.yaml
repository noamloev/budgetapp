services:
  - type: web
    name: budget-flow
    runtime: static
    buildCommand: ./render-build.sh
    staticPublishPath: build/web
    pullRequestPreviewsEnabled: false
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
